- slug: a-better-lesson
  title: "A Better Lesson: Staying on the Right Side of Scale"
  authors: Michael A. Heroux
  quiz: true
  date: "2026-11-06"
  version: "1.0"
  doi: 10.5281/zenodo.24024225
  summary: >
    Rising compute and AI capability do not erode all investments equally.
    They tend to erode work that hand-encodes particular solutions, and they
    tend to reward work that makes solutions checkable. We propose four
    principles for staying on the right side of scale: build on what scales,
    anchor in ground truth, make knowledge legible, and reserve people for
    judgment.
  video:
    id: Wdefbre9q38
    kind: short
    thumbnail: a-better-lesson-video.jpg

- slug: slide-rule-guide
  title: "The Slide Rule Guide: Ideas for If, When, and How to Use Generative AI Tools for Education"
  authors: Michael A. Heroux
  quiz: true
  date: "2026-11-06"
  version: "1.0"
  doi: 10.5281/zenodo.24027009
  summary: >
    Generative AI tools are the new calculators, and they turn some, but not
    all, existing educational activities into slide rules: labor-intensive
    steps that were required only because no faster method existed, not
    because the process itself built understanding. The essay names two risks
    for educators: permitting AI as a calculator where a paper-and-pencil
    approach is needed to build fundamentals, and prohibiting AI where it is
    appropriate, handing students a slide rule when they need a calculator.
    The challenge is to distinguish these cases and redesign activities around
    interpretation, creativity, and critical thinking.
  video:
    id: qbL50ds6Nlo
    kind: short
    thumbnail: slide-rule-guide-video.jpg

- slug: qpus-are-not-gpus
  title: "QPUs Are Not GPUs: Why Quantum Processors Need Constant Classical Control"
  authors: Michael A. Heroux
  quiz: true
  date: "2026-11-06"
  version: "1.0"
  doi: 10.5281/zenodo.24028100
  summary: >
    Many in the HPC community expect quantum processing units (QPUs) to fit
    into future systems the way GPUs do: as accelerators that receive work from
    a host and return results. This paper argues that the analogy misses
    something essential. Qubits are fragile, and useful quantum computation
    depends on quantum error correction, in which classical decoders must
    interpret syndrome measurements and feed corrections back to the device
    continuously, often within microseconds. It closes with implications for
    system architects and facility planners: integrating quantum computing into
    HPC is as much a classical systems problem as a quantum one.
  video:
    id: qJzObldTwzU
    kind: short
    thumbnail: qpus-are-not-gpus-video.jpg

# Already published elsewhere: `url` replaces the DOI link for the paper,
# `venue` names where it appeared, and `related` lists other versions.
# The cover is page 2 of the Digital Commons PDF (page 1 is its cover sheet).
- slug: research-software-science
  title: "Research Software Science: Expanding the Impact of Research Software Engineering"
  authors: Michael A. Heroux
  quiz: true
  date: "2022-11-01"
  venue: "Computing in Science & Engineering 24(6): 22–27"
  url: https://digitalcommons.csbsju.edu/csci_pubs/36/
  summary: >
    Software plays a central role in scientific discovery. Improving how we
    develop and use software for research can have both broad and deep impacts
    on a spectrum of challenges and opportunities society faces today. The
    emergence of the Research Software Engineer (RSE) as a role correlates with
    the growing complexity of scientific challenges and the diversity of
    software team skills. In this paper, we describe research software science
    (RSS), an idea related to RSE, and particularly suited to research software
    teams. RSS promotes the use of scientific methodologies to explore and
    establish broadly applicable knowledge. Using RSS, we can pursue
    sustainable, repeatable, and reproducible software improvements that
    positively impact research software toward improved scientific discovery.
  related:
    - label: "Journal version on IEEE Xplore"
      url: https://ieeexplore.ieee.org/document/10078171
    - label: "Research Software Science: A Scientific Approach to Understanding and Improving How We Develop and Use Software for Research"
      note: "Better Scientific Software blog"
      url: https://bssw.io/blog_posts/research-software-science-a-scientific-approach-to-understanding-and-improving-how-we-develop-and-use-software-for-research
    - label: "Is Research Software Science a Metascience?"
      note: "Eisinger and Heroux, arXiv 2025"
      url: https://arxiv.org/abs/2509.13436
  video:
    id: 6gz3zvkkmmc
    kind: short
    thumbnail: research-software-science-video.jpg
    doi: 10.5281/zenodo.24115973

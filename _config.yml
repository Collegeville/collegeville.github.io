title: Collegeville
tagline: "Learning and Working as Computing Advances"
description: >
  Applying the scientific method to how we learn, build, and trust technical
  work as computing changes, with AI the driver today and other advances on
  the horizon.
url: "https://collegeville.github.io"
# Organization root site, so baseurl is empty. Corpus and the other project
# sites (/Corpus/, /papers/, /Scribe/, ...) deploy from their own repos.
baseurl: ""

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

sass:
  style: compressed

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# Share image for every page. jekyll-seo-tag turns this into og:image (with
# width, height and alt) and a large Twitter card, using an absolute URL.
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /images/collegeville-social-preview.png
        width: 1280
        height: 640
        alt: "Collegeville: a rising line inside a letter C, with the tagline Learning and working as computing advances"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor

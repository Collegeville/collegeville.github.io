title: Collegeville
tagline: "Research Software Science"
description: >
  Applying the scientific method to how we learn, build, and trust research
  software, now in the age of AI.
url: "https://collegeville.github.io"
# Organization root site, so baseurl is empty. Corpus and the other project
# sites (/Corpus/, /Scribe/, ...) deploy from their own repos.
baseurl: ""
# Shared quiz player for papers with `quiz: true` (repo Collegeville/article-quiz).
quiz_player: "https://collegeville.github.io/article-quiz/player/player.html"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

sass:
  style: compressed

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor

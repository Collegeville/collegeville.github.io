<header class="topbar">
  <div class="wrap">
    <div class="topbar__id">
      <a class="brand" href="{{ '/' | relative_url }}">Collegeville</a>
      <span>{{ site.tagline }}</span>
    </div>
    <nav aria-label="Primary">
      <a href="{{ '/papers/' | relative_url }}"{% if page.url == '/papers/' %} aria-current="page"{% endif %}>Papers</a>
      <a href="{{ '/Corpus/' | relative_url }}">Corpus</a>
      <a href="{{ '/archive/' | relative_url }}"{% if page.url == '/archive/' %} aria-current="page"{% endif %}>Archive</a>
      <span class="topbar__sep" aria-hidden="true"></span>
      <a class="topbar__games" href="{{ '/games/' | relative_url }}"{% if page.url == '/games/' %} aria-current="page"{% endif %}>Games</a>
    </nav>
  </div>
</header>
